# configs/training/training.yaml
# =============================================================================

# configs/training/training.yaml
# =============================================================================
# Training Configuration
# =============================================================================
#
# This file configures the full training pipeline.
#
# New pipeline logic:
#
#   data_processing
#       -> builds base_artifact.joblib
#
#   asset_pipeline
#       -> materializes experiment_artifact.joblib from the base artifact
#
#   training_pipeline
#       -> loads experiment_artifact.joblib
#       -> prepares train/validation/holdout masks
#       -> instantiates the selected model
#       -> delegates the training loop to GeneralTrainer
#       -> runs configured evaluations
#       -> saves summaries and optional ledger records
#
# Important
# ---------
# The training pipeline should NOT read TNTP files, build graphs, adapt routes,
# construct targets, or search for flow columns. Those responsibilities belong
# to the data_ingestion / data_processing block.
# =============================================================================


# -----------------------------------------------------------------------------
# Artifact loading
# -----------------------------------------------------------------------------
#
# The experiment artifact is the single source of truth for training inputs.
#
# Resolution priority in training_pipeline.py:
#   1. training.artifact.path
#   2. training.training_artifact_path
#   3. experiment.identity.artifact_path
#
# Keeping `path` explicit is recommended for clarity.
# -----------------------------------------------------------------------------

artifact:
  # Used if `path` points to a directory instead of a file.
  filename: experiment_artifact.joblib

  # Full path to the experiment artifact generated by the asset pipeline.
  path: ${oc.select:experiment.identity.artifact_path,null}

  # Validate the artifact structure immediately after loading.
  validate_on_load: true

  # Usually false. The artifact is portable when saved on CPU.
  # The TrainingInputPreparer moves only the required tensors to the training device.
  move_to_device_on_load: false


# Backward-compatible shortcut used by training_pipeline.py as a fallback.
training_artifact_path: ${training.artifact.path}


# -----------------------------------------------------------------------------
# Runtime and device configuration
# -----------------------------------------------------------------------------

# Supported:
#   auto    -> use CUDA if available, otherwise CPU
#   cpu
#   cuda
#   cuda:0
device: cuda

# What to do if CUDA is requested but not available.
# Supported:
#   cpu
#   error
device_fallback: cpu

# If true, stricter checks are applied when preparing training inputs.
strict_data: true

# Seed used by k-fold splitting and other training-level random decisions.
random_seed: ${oc.select:random_seed, 42}


# -----------------------------------------------------------------------------
# Output structure
# -----------------------------------------------------------------------------
#
# run_context.py uses these fields to create:
#
#   output_root/
#     runs/
#       model_name/
#         dataset_runhash/
#           models/
#           diagnostics/
#           evaluation/
#           logs/
#           summaries/
# -----------------------------------------------------------------------------

# Root output directory for training runs.
output_root: ${paths.outputs}

# Optional custom run directory template.
#
# Available placeholders:
#   {run_hash}
#   {model_name}
#   {dataset_name}
#
# If null, run_context.py uses:
#   ${training.output_root}/runs/${model.model_name}/${dataset.name}_{run_hash}
run_dir_template: null

# Prefix used by _pipeline_utils.get_run_filenames().
# The run hash is appended automatically.
filename_prefix: ${dataset.name}_${model.model_name}


# -----------------------------------------------------------------------------
# Core training hyperparameters
# -----------------------------------------------------------------------------

epochs: 300
batch_size: 1

# Backward-compatible scalar fields.
# These are still read by the trainer as fallbacks.
lr: 0.002
weight_decay: 4.5e-5
momentum: 0.0
grad_clip_norm: 5.0


# -----------------------------------------------------------------------------
# Runtime reproducibility and backend tuning
# -----------------------------------------------------------------------------
#
# deterministic: true improves reproducibility but may reduce speed.
# cudnn_benchmark: true can improve speed when tensor shapes are stable.
# matmul_precision: high can improve GPU throughput for float32 matrix operations.
# -----------------------------------------------------------------------------

runtime:
  seed_everything: true
  deterministic: false
  deterministic_warn_only: true
  cudnn_benchmark: true
  cudnn_deterministic: false
  matmul_precision: high


# -----------------------------------------------------------------------------
# Optimizer
# -----------------------------------------------------------------------------
#
# Supported:
#   adam
#   adamw
#   sgd
#   nadam
#   radam
#
# allow_model_param_groups:
#   If true and the model exposes get_optimizer_param_groups(), the trainer uses
#   the model-defined parameter groups. This keeps the trainer model-agnostic.
# -----------------------------------------------------------------------------

optimizer:
  name: adamw
  lr: ${training.lr}
  weight_decay: ${training.weight_decay}
  betas: [0.9, 0.999]
  eps: 1.0e-8
  amsgrad: false

  # Only used by SGD.
  momentum: ${training.momentum}
  nesterov: false

  # Only used by NAdam.
  momentum_decay: 0.004

  allow_model_param_groups: true


# If true, trainer audits optimizer parameter registration.
# Useful for debugging disconnected parameters, but noisy in normal runs.
audit_optimizer: false


# -----------------------------------------------------------------------------
# Warmup policy
# -----------------------------------------------------------------------------
#
# model:
#   Passes warmup=True to the model during the first N epochs.
#
# lr:
#   Applies learning-rate warmup inside the trainer/scheduler.
#   This is fully model-agnostic.
# -----------------------------------------------------------------------------

warmup:
  model:
    enabled: false
    epochs: 10

  lr:
    enabled: true
    epochs: 25
    start_factor: 0.05


# -----------------------------------------------------------------------------
# Gradient control
# -----------------------------------------------------------------------------
#
# clip:
#   Clips gradients after backward() and before optimizer.step().
#
# skip_update:
#   Skips optimizer.step() when gradient health is suspicious.
#   This prevents destructive parameter updates.
#
# gradient_audit:
#   Optional diagnostics only. It does not control training stability.
# -----------------------------------------------------------------------------

gradient_control:
  clip:
    enabled: true
    max_norm: ${training.grad_clip_norm}
    norm_type: 2.0

  skip_update:
    enabled: true
    on_non_finite: true
    max_grad_norm: null
    log: true
    max_logged_warnings: 20

gradient_audit:
  # Master switch for optional training diagnostics.
  # This does not control clipping or optimizer skipping.
  # Those safety mechanisms belong to training.gradient_control.
  enabled: false

  # Collect diagnostics during the first N epochs.
  first_n_epochs: 10

  # Optional periodic diagnostics after the first N epochs.
  # Use 0 to disable periodic collection.
  every_n_epochs: 0

  # Optional explicit epochs where diagnostics should be collected.
  epochs: []

  # Collect grouped gradient norms after total_loss.backward().
  # This is relatively cheap because gradients already exist.
  include_gradient_groups: true

  # Collect scalar statistics from model forward outputs such as:
  # learned_alpha, learned_beta, learned_theta, learned_capacity_multiplier,
  # and solver convergence_info when available.
  include_forward_physics: true

  # Collect per-loss-component gradient contribution using autograd.grad().
  # This is more expensive because it computes gradients per loss component.
  # Recommended default: false.
  include_loss_components: false


# -----------------------------------------------------------------------------
# Automatic Mixed Precision
# -----------------------------------------------------------------------------
#
# AMP is enabled only when:
#   training.amp.enabled = true
#   and device starts with "cuda"
# -----------------------------------------------------------------------------

amp:
  enabled: false


# -----------------------------------------------------------------------------
# Learning-rate scheduler
# -----------------------------------------------------------------------------
#
# Supported scheduler types:
#   reduce_on_plateau
#   step
#   cosine
#   cosine_with_warmup
#   one_cycle
#   none
#
# For this project, cosine_with_warmup is a good default because it gives a
# controlled start and then gradually anneals the LR.
# -----------------------------------------------------------------------------

scheduler:
  enabled: true
  type: cosine_with_warmup

  # Shared lower bound.
  min_lr: 1.0e-8

  # Parameters for cosine / cosine_with_warmup.
  t_max: ${training.epochs}
  warmup_epochs: ${training.warmup.lr.epochs}
  warmup_start_factor: ${training.warmup.lr.start_factor}

  # Parameters for ReduceLROnPlateau.
  factor: 0.5
  patience: 8
  threshold: 1.0e-4
  threshold_mode: rel
  cooldown: 0

  # Parameters for StepLR.
  step_size: 50
  gamma: 0.5

  # Parameters for OneCycleLR.
  max_lr: null
  pct_start: 0.15
  div_factor: 25.0
  final_div_factor: 1000.0
  anneal_strategy: cos

scheduler_monitor: auto


# -----------------------------------------------------------------------------
# Early stopping
# -----------------------------------------------------------------------------
#
# monitor:
#   auto  -> val_mse if validation exists, otherwise train_loss
#   train -> train_loss
#   val   -> val_mse
# -----------------------------------------------------------------------------

early_stopping:
  enabled: false
  patience: 15
  min_delta: 0.0001
  monitor: auto


# -----------------------------------------------------------------------------
# Checkpointing
# -----------------------------------------------------------------------------
#
# The trainer always saves a final checkpoint.
# If save_every > 0, intermediate checkpoints are also saved.
# -----------------------------------------------------------------------------

checkpointing:
  save_every: 0


# -----------------------------------------------------------------------------
# Cross-validation
# -----------------------------------------------------------------------------
#
# k_folds = 1:
#   Standard run with one global train mask and no internal validation fold.
#
# k_folds > 1:
#   K-fold split over the sampled observed flow links.
# -----------------------------------------------------------------------------

k_folds: 1


# -----------------------------------------------------------------------------
# Prescaling
# -----------------------------------------------------------------------------
#
# Injected into model_params before Hydra model instantiation:
#
#   model_params["link_scale"]
#   model_params["od_scale"]
#
# Supported modes:
#   observed_mean
#   observed_median
#   observed_max
#   p95
#   none
#
# You can also force explicit values with:
#   link_scale: <float>
#   od_scale: <float>
# -----------------------------------------------------------------------------

prescaling:
  enabled: true

  # Global fallback mode if link_scale_mode or od_scale_mode are not provided.
  mode: none

  link_scale_mode: none
  od_scale_mode: none

  # Optional explicit values. If null, they are computed from observed targets.
  link_scale: null # null
  od_scale: null # null


# -----------------------------------------------------------------------------
# OD initialization
# -----------------------------------------------------------------------------
#
# This is consumed by optional model hooks, especially VI-style models.
#
# Supported:
#   known_mean
#   low_unknown
# -----------------------------------------------------------------------------

od_initialization:
  mode: known_mean
  low_unknown_value: 0.01


# -----------------------------------------------------------------------------
# Optional model hook
# -----------------------------------------------------------------------------
#
# Recommended pattern:
#
# In model YAML:
#
#   pipeline_pre_instantiate_hook:
#     src.train._pipeline_utils.vi_od_initialization_hook
#
# The hook receives:
#   cfg
#   model_params
#   context
#
# and returns a dict of model parameter updates.
# -----------------------------------------------------------------------------

# This is intentionally left here as documentation only.
# The actual hook should be defined inside the model YAML because it is model-specific.
pipeline_pre_instantiate_hook: null


# -----------------------------------------------------------------------------
# Evaluation configuration
# -----------------------------------------------------------------------------
#
# These evaluations are run after trainer.fit().
#
# evaluate_validation:
#   Evaluates each fold validation mask when k_folds > 1.
#
# evaluate_holdout:
#   Evaluates observed links not selected by the global training mask.
#
# evaluate_full_observed:
#   Evaluates all observed flow links.
# -----------------------------------------------------------------------------

evaluation:
  enabled: true

  evaluate_validation: true
  evaluate_holdout: true
  evaluate_full_observed: true

  # If true, evaluation_utils.py returns prediction DataFrames.
  return_predictions: true

  # If true, metrics JSON and prediction CSV files are saved.
  save_predictions: true

  # Temporal Audit
  vi_debug_audit:
    enabled: false


# -----------------------------------------------------------------------------
# Ledger / experiment registry
# -----------------------------------------------------------------------------
#
# If enabled, training_pipeline.py tries to call:
#
#   src.utils.ledger.update_experiments_ledger
#
# This is optional and should not be required for the training pipeline to run.
# -----------------------------------------------------------------------------

ledger:
  enabled: true


# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
#
# run_context.py checks:
#   logging.level
# or:
#   training.logging.level
# -----------------------------------------------------------------------------

logging:
  level: INFO


#--------------------------------------------------------------------------------
# Oracle configuration
#--------------------------------------------------------------------------------
vi_oracle_debug:
  enabled: false

# --------------------------------------------------------------------------------
