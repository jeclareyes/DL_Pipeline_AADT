# @package _global_
# configs/dataset/Synthetic01.yaml

# =============================================================================

# DATA
# Responsabilidad: Definir la ubicación física de los archivos de este dataset.
# Ante la creación de nuevos datasets, solo es necesario crear un nuevo archivo YAML
# similar a este, especificando las rutas y parámetros específicos del dataset.
# =============================================================================
data:
  dataset: "Synthetic01"
  # Usamos la variable global paths.root_dir definida en config.yaml si es necesario,
  # o una ruta relativa estándar.
  base_path: "data/processed/Synthetic01"

  # Nombres de archivo específicos para este dataset
  graph_file: "Synthetic01_graph.pkl"
  link_data_file: "Synthetic01_link_data.parquet"
  od_matrix_file: "Synthetic01_od_matrix.npz"

  # Cache de rutas (usamos interpolación para ser consistentes)
  routing_cache_file: "routing_cache/${data.dataset}_kshortest_paths.pkl"

  # Configuración del escenario de datos
  volume_year: False
  train_split: 0.8
  random_seed: 42

# PARTIAL DATA SAMPLING
# (Opcional: Si este dataset requiere un sampling específico por defecto)
# =============================================================================
sampling:
  flow_rate: 0.8
  od_rate: 1.0
  strategy: "random"
  sampling_basis: "link_wise_based"
  random_seed: 42

# NETWORK
# Parámetros físicos de la red (específicos de la topología de Synthetic01)
# =============================================================================
network:
  k_paths: 3
  max_route_length: 10
  cost_function: "bpr" # 'akcelik' | 'bpr_modified' | 'conical' | 'bpr'

  # Parámetros iniciales de BPR (pueden ser específicos de la red)
  bpr_params:
    learn_alpha: true
    learn_beta: true
    alpha_init: 0.15
    beta_init: 4.0
    alpha_bounds: [0.01, 1.0]
    beta_bounds: [1.0, 10.0]
