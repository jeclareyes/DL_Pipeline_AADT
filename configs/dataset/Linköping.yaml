# @package _global_
# configs/dataset/Linköping.yaml

# =============================================================================

# DATA
# Responsabilidad: Definir la ubicación física de los archivos de este dataset.
# =============================================================================
data:
  dataset: "Linköping"
  # Usamos la variable global paths.root_dir definida en config.yaml si es necesario,
  # o una ruta relativa estándar.
  base_path: "data/processed/Linköping"

  # Nombres de archivo específicos para este dataset
  graph_file: "Linköping_graph.pkl"
  link_data_file: "Linköping_link_data.parquet"
  od_matrix_file: "Linköping_od_matrix.npz"

  # Cache de rutas (usamos interpolación para ser consistentes)
  routing_cache_file: "routing_cache/${data.dataset}_kshortest_paths.pkl"

  # Configuración del escenario de datos
  volume_year: 2022
  train_split: 0.8
  random_seed: 42

# PARTIAL DATA SAMPLING
# (Opcional: Si este dataset requiere un sampling específico por defecto)
# =============================================================================
sampling:
  flow_rate: 0.8
  od_rate: 1.0
  strategy: "random"
  sampling_basis: "link_wise_based"
  random_seed: 42

# NETWORK
# Parámetros físicos de la red (específicos de la topología de Linköping)
# =============================================================================
network:
  k_paths: 10
  max_route_length: 130
  cost_function: "conical" # 'akcelik' | 'bpr_modified' | 'conical' | 'bpr'

  # Parámetros iniciales de BPR (pueden ser específicos de la red)
  bpr_params:
    learn_alpha: true
    learn_beta: true
    alpha_init: 0.15
    beta_init: 4.0
    alpha_bounds: [0.01, 1.0]
    beta_bounds: [1.0, 10.0]
