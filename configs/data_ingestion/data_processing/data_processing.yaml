# src/data_handling/data_processing.yaml

# =============================================================================
# Data Processing Configuration
# =============================================================================
#
# This configuration controls only the base-artifact stage that transforms
# TNTP scenario files into canonical dataset data.
#
# Pipeline:
#   TNTP files
#       -> readers
#       -> link table builder
#       -> graph builder
#       -> canonical processed objects
#       -> artifact validator
#       -> base_artifact.joblib
#
# This file is intended to be consumed by:
#
#   cfg.data_handling.data_processing
#
# from data_processing.py.
# =============================================================================


# -----------------------------------------------------------------------------
# General dataset information
# -----------------------------------------------------------------------------

description: >
  Base-artifact configuration for building canonical dataset data from
  TNTP files generated by the scenario creation pipeline.

# The main output is a single base_artifact.joblib file. A lightweight JSON
# manifest is also written for quick inspection.

# -----------------------------------------------------------------------------
# Reader configuration
# -----------------------------------------------------------------------------
#
# Readers are responsible only for reading and normalizing TNTP files.
# They should not build graphs, tensors or artifacts.
# -----------------------------------------------------------------------------

readers:

  nodes:

    # Fail if required node columns are missing or contain invalid values.
    strict: true

    # Preserve additional node attributes beyond the required schema.
    preserve_extra_columns: true

    # Required normalized columns in the node table.
    #
    # "type" identifies the specific node category, such as TAZ, AUX or
    # INTERSECTION.
    #
    # "class" groups node types into domain-level roles, such as Zones and
    # NonZones.
    required_columns:
      - node_id
      - x
      - y
      - type
      - class


  network:
    strict: true
    preserve_extra_columns: true

    # Required canonical columns:
    #   init_node, term_node, capacity_per_lane, total_capacity,
    #   effective_capacity, length, free_flow_time
    required_columns:
      - init_node
      - term_node
      - capacity_per_lane
      - total_capacity
      - effective_capacity
      - length
      - free_flow_time

    apply_default_optional_columns: false

    optional_defaults:
      lanes: 1
      b: 0.15
      power: 4.0
      speed: null
      vdf: null
      toll: 0.0
      link_type: 0

  flows:
    strict: true
    preserve_extra_columns: true


  trips:
    strict: true

    # Supported values:
    #   sum
    #   average_daily
    #   average_matrix
    aggregation: average_daily

    # If True, the trips file is expected to contain multiple matrices or dates.
    # The trips reader will aggregate them according to trips.aggregation.
    multiday_od: true

    matrix_format: csr
    include_zero_flows: false

    # Important for synthetic scenarios:
    # The OD matrix must use compact zone-space indexing through mapping:
    #
    #   real zone ID -> compact matrix index
    #
    # This avoids assuming that zone IDs are consecutive.
    use_zone_id_mapping: true
    infer_zone_ids_from_origin_lines: true

  routes:
    strict: true
    allow_empty_routes: true
    preserve_empty_od_pairs: true

    # The TNTP routes file is read into raw.primary_source_route_set and
    # normalized into processed.primary_source_route_set. This is the dataset's
    # source route set for provenance and validation only; it is not the route
    # set selected by an experiment. The training_artifact always uses the
    # route_set resolved by the active experiment.

    # If the route file is compact and contains one route-list line per OD pair,
    # OD identity is reconstructed from zone_ids.
    compact_format_uses_zone_ids: false

    # Usually this should match model.k_paths.
    max_routes_per_od: 10

# -----------------------------------------------------------------------------
# Builder configuration
# -----------------------------------------------------------------------------
#
# Builders are responsible only for transforming the raw data previously read
# and normalized by reader modules into canonical base-artifact objects.
# -----------------------------------------------------------------------------

builders:

  # link_table_builder | graph_builder | routes_builder | target_builder

  # Link table builder configuration
  link_table:
    ## Builds a canonical link_df by merging network_df and flow_df.
    # TODO: go to LinkTableBuilder and simplify logic. (link_table_builder.py)

    strict: true
    preserve_extra_flow_columns: true # TODO: this shall always be true.

    # If duplicated flow records exist for the same directed link, choose how to
    # handle them.
    aggregate_duplicate_flows: true

    # Supported values:
    #   mean
    #   sum
    #   first
    duplicate_flow_aggregation: mean

    # Missing flow records should not be converted to zero here.
    # The target builder will handle missing values through masks.


  # -----------------------------------------------------------------------------
  # Graph builder configuration
  # -----------------------------------------------------------------------------
  #
  # Builds a NetworkX directed graph (DiGraph) from the canonical link_df and
  # node_df, plus the edge/node indexing payloads used downstream by the route
  # model adapter and target builder.
  # -----------------------------------------------------------------------------
  graph:

    # --------------------------------------------
    # strict: bool  (default true)
    # --------------------------------------------
    # Enables hard validation instead of best-effort fallbacks.
    #
    # -> Code: GraphBuilder.__init__ (graph_builder.py:167) stores
    #    self.strict = bool(strict).
    #    Conditions branch on it at graph_builder.py:290 (node/column
    #    requirements), :306 (dataset weight column missing), :365 (missing link
    #    attributes -> raise), :427 (missing node endpoints -> raise).
    #    Also read for the route recompute path in routes_builder.py:127.
    #
    #    When strict=True, inconsistencies raise; when False, the builder
    #    soft-falls back to defaults/orders.
    strict: true

    # --------------------------------------------
    # dataset_weight_column: str
    # --------------------------------------------
    # Dataset-owned edge attribute used as the default route weight.
    #
    dataset_weight_column: ${dataset.network.weight_column}

    # --------------------------------------------
    # preserve_extra_attributes: bool  (default true)
    # --------------------------------------------
    # Whether to copy non-canonical DataFrame columns onto the graph edges
    # (and nodes) as attributes.
    #
    # -> Code: GraphBuilder.__init__ (graph_builder.py:169). Branches guard
    #    the attribute-copy loops at graph_builder.py:588 and :623. When
    #    false, extra columns are dropped from the graph (only canonical ones
    #    kept, shrinking serialized artifact size).
    #    Also used in routes_builder.py:129.
    preserve_extra_attributes: true


  # -----------------------------------------------------------------------------
  # OD indexing configuration
  # -----------------------------------------------------------------------------
  #
  # Controls how OD pairs and zone IDs are represented in the processed artifact.
  # -----------------------------------------------------------------------------

  od_indexing:

    # Include origin-destination pairs where origin and destination are the same
    # zone.
    #
    # When false, intrazonal pairs are removed from the canonical OD space and
    # must also be absent from OD targets, route tensors, assignment assets and
    # OD-space fingerprints.
    #
    # This option controls OD-space membership. It does not control whether the
    # route generator creates routes that start and end at the same node.
    include_intrazonal_pairs: true


# -----------------------------------------------------------------------------
# Validation configuration
# -----------------------------------------------------------------------------
#
# Controls validation of the base_artifact only.
#
# This block must not grow model-ready or experiment-specific checks. The base
# artifact has no selected experiment route_set, no assignment ground truth,
# no route tensors and no training targets. Those checks belong to the
# training-artifact validation contract in configs/training/training.yaml.
# -----------------------------------------------------------------------------

validation:
  # If false, the base artifact is built without running its contract
  # validator. This is intended only for diagnostics/development; production
  # processing should keep it true.
  enabled: true

  # If true, validation errors stop base-artifact creation. If false, the
  # artifact is returned with an invalid validation summary for inspection.
  strict: true

  # Checks that every route in the dataset's primary_source_route_set uses
  # directed edges present in the canonical processed graph. This validates
  # source-data integrity only; it does not validate an experiment route_set.
  check_route_graph_compatibility: true

  # Maximum number of examples included in validation error/warning contexts.
  max_reported_items: 20


# -----------------------------------------------------------------------------
# Artifact saving configuration
# -----------------------------------------------------------------------------

artifact:
  save_joblib: true
  save_manifest: true
