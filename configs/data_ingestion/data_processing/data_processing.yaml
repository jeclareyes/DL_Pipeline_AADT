# src/data_ingestion/data_processing.yaml

# =============================================================================
# Data Processing Configuration
# =============================================================================
#
# This configuration controls the full data-processing block that transforms
# TNTP scenario files into a unified training artifact.
#
# Pipeline:
#   TNTP files
#       -> readers
#       -> link table builder
#       -> graph builder
#       -> target builder
#       -> route model adapter
#       -> artifact validator
#       -> base_artifact.joblib
#
# This file is intended to be consumed by:
#
#   cfg.data_ingestion.data_processing
#
# from data_processing.py.
# =============================================================================


# -----------------------------------------------------------------------------
# General dataset information
# -----------------------------------------------------------------------------

dataset_name: ${dataset.name}

device: cpu # "cpu", "cuda"

description: >
  Data-processing configuration for building a unified training artifact from
  TNTP files generated by the scenario creation pipeline.

random_seed: 42

# Target flow year used by tntp_flow_reader.py when the flow file contains
# year-specific columns such as Volume_2022, Volume_2023, etc.
#
# Use null when the flow file contains a generic "Volume" or "volume" column.
volume_year: Volume # Volume_2022: Linköping, Volume: SiouxFalls & Synthetic


# -----------------------------------------------------------------------------
# Input TNTP routes
# -----------------------------------------------------------------------------
#
# These are the raw files consumed by the five readers.
# They should be text-based TNTP-like files, not pickles.
# -----------------------------------------------------------------------------

input_routes:
  #general_route: data/scenarios/${data_ingestion.data_processing.dataset_name}
  general_route: ${paths.data_raw}/${..dataset_name}


  node_route: ${.general_route}/${..dataset_name}_nodes.tntp
  network_route: ${.general_route}/${..dataset_name}_network.tntp
  trips_route: ${.general_route}/${..dataset_name}_trips.tntp
  routes_route: ${.general_route}/${..dataset_name}_routes.tntp
  flow_route: ${.general_route}/${..dataset_name}_flows.tntp


# -----------------------------------------------------------------------------
# Optional: recompute routes from TNTP inputs
# -----------------------------------------------------------------------------

routes_recompute:
  enabled: true
  engine: rustworkx_optimized # networkx | rustworkx | rustworkx_optimized
  overwrite_existing: true
  k_paths: ${..readers.routes.max_routes_per_od}
  weight: ${..graph.weight_column}
  allow_duplicates: false
  allow_loops: false
  allow_auto_routes: true
  connector_link_types: [99]

  parallel: true
  parallel_workers: 20
  od_batch_size: 20


# -----------------------------------------------------------------------------
# Optional: recompute flow targets from the active route set
# -----------------------------------------------------------------------------
#
# If routes are recomputed, assigned link-flow targets must be regenerated from
# those same routes. Otherwise the training artifact can mix a fresh delta
# matrix with stale flows from a different route set or assignment paradigm.
# -----------------------------------------------------------------------------

flow_recompute:
  enabled: true
  overwrite_existing: true
  behavior_model: stochastic_user_equilibrium # stochastic_user_equilibrium | route_based_user_equilibrium
  solver: msa
  max_iterations: 10000
  capacity_scaling_factor: 1.0
  theta: 2.0
  msa_step_rule: 1_over_n

  convergence:
    equilibrium_l1_threshold: 20.0
    max_absolute_gap_threshold: 2.0
    max_relative_gap_threshold: 5.0e-4
    min_flow_for_relative_gap: 1.0


# -----------------------------------------------------------------------------
# Output routes
# -----------------------------------------------------------------------------
#
# The main output is a single base_artifact.joblib file.
# A lightweight JSON manifest is also written for quick inspection.
# -----------------------------------------------------------------------------

output_routes:
  processed_route: ${paths.data_processed}/${..dataset_name}

  artifact_filename: base_artifact.joblib
  manifest_filename: base_manifest.json

  overwrite_existing: true
  save_manifest: true


# -----------------------------------------------------------------------------
# Reader configuration
# -----------------------------------------------------------------------------
#
# Readers are responsible only for reading and normalizing TNTP files.
# They should not build graphs, tensors or artifacts.
# -----------------------------------------------------------------------------

readers:

  nodes:
    strict: true
    preserve_extra_columns: true

    # Required canonical columns:
    #   node_id, x, y, type
    #
    # Optional:
    #   class
    required_columns:
      - node_id
      - x
      - y
      - type

  network:
    strict: true
    preserve_extra_columns: true

    # Required canonical columns:
    #   init_node, term_node, capacity_per_lane, total_capacity,
    #   effective_capacity, length, free_flow_time
    required_columns:
      - init_node
      - term_node
      - capacity_per_lane
      - total_capacity
      - effective_capacity
      - length
      - free_flow_time

    apply_default_optional_columns: false

    optional_defaults:
      lanes: 1
      b: 0.15
      power: 4.0
      speed: null
      vdf: null
      toll: 0.0
      link_type: 0

  flows:
    strict: true
    preserve_extra_columns: true

    # Use null to let the reader infer the volume column.
    # Use for example "Volume_2022" to force a specific column.
    volume_column: Volume_2022 # null means auto-detect

    # If volume_year is not null, the reader may search for:
    #   Volume_2022, flow_2022, aadt_2022, count_2022, etc.
    volume_year: all # if all, the reader finds every column containing traffic counts, and then averages them.

    # Missing volumes must remain NaN so target_builder.py can create masks.
    preserve_missing_volumes_as_nan: true

  trips:
    strict: true

    # Supported values:
    #   sum
    #   average_daily
    #   average_matrix
    aggregation: average_daily

    # If True, the trips file is expected to contain multiple matrices or dates.
    # The trips reader will aggregate them according to trips.aggregation.
    multiday_od: true

    matrix_format: csr
    include_zero_flows: false

    # Important for synthetic scenarios:
    # The OD matrix must use compact zone-space indexing through mapping:
    #
    #   real zone ID -> compact matrix index
    #
    # This avoids assuming that zone IDs are consecutive.
    use_zone_id_mapping: true
    infer_zone_ids_from_origin_lines: true

  routes:
    strict: true
    allow_empty_routes: true
    preserve_empty_od_pairs: true

    # If the route file is compact and contains one route-list line per OD pair,
    # OD identity is reconstructed from zone_ids.
    compact_format_uses_zone_ids: false

    # Usually this should match model.k_paths.
    max_routes_per_od: 10


# -----------------------------------------------------------------------------
# Link table builder configuration
# -----------------------------------------------------------------------------
#
# Builds link_df by merging network_df and flow_df.
# -----------------------------------------------------------------------------

link_table:
  strict: true

  preserve_extra_flow_columns: true

  # If duplicated flow records exist for the same directed link, choose how to
  # handle them.
  aggregate_duplicate_flows: true

  # Supported values:
  #   mean
  #   sum
  #   first
  duplicate_flow_aggregation: mean

  # Missing flow records should not be converted to zero here.
  # The target builder will handle missing values through masks.
  preserve_missing_volume_as_nan: true


# -----------------------------------------------------------------------------
# Graph builder configuration
# -----------------------------------------------------------------------------
#
# Builds a NetworkX DiGraph from link_df and node_df.
# -----------------------------------------------------------------------------

graph:
  strict: true

  # If false, every edge endpoint must exist in node_df.
  add_missing_link_nodes: false

  preserve_extra_attributes: true

  # Edge attribute used as default route weight.
  weight_column: free_flow_time

  # Store init_node and term_node also as edge attributes for debugging/export.
  store_edge_endpoints_as_attributes: true

  # Useful for reproducibility:
  edge_order_source: link_df_row_order
  node_order_source: node_df_row_order


# -----------------------------------------------------------------------------
# OD indexing configuration
# -----------------------------------------------------------------------------
#
# Controls how OD pairs and zone IDs are represented in the processed artifact.
# -----------------------------------------------------------------------------

od_indexing:
  use_real_zone_ids: true

  # Supported values:
  #   node_class
  #   node_type
  #   origin_lines
  #
  # Recommended:
  #   node_class, then origin_lines as fallback.
  zone_id_source_priority:
    - node_class
    - node_type
    - origin_lines

  zone_class_values:
    - zone
    - zones
    - taz

  exclude_intrazonal_pairs: false

  store_zone_id_to_idx: true
  store_idx_to_zone_id: true


# -----------------------------------------------------------------------------
# Target builder configuration
# -----------------------------------------------------------------------------
#
# Builds flow and OD targets plus observation masks.
# -----------------------------------------------------------------------------

targets:
  strict: true

  create_tensors: true
  tensor_device: ${..device} # "cpu", "cuda"
  tensor_dtype: float32

  # Missing values are filled only after masks are created.
  missing_target_fill_value: -1.0

  flows:
    target_column: volume

    # Mask value:
    #   1.0 -> observed
    #   0.0 -> missing
    build_observed_mask: true

    allow_no_observed_flows: false

  od:
    target_column: flow
    align_with_routes_by_od: true
    build_observed_mask: true

    # For now, OD targets should be vectorized only for OD pairs that have
    # corresponding route slots.
    use_route_od_space: true

    allow_no_observed_od: false


# -----------------------------------------------------------------------------
# Route model adapter configuration
# -----------------------------------------------------------------------------
#
# Converts graph + routes_by_od into tensors used by route-based models.
# -----------------------------------------------------------------------------

route_model_adapter:
  device: ${..device}

  # Usually inherited from model.k_paths.
  k_paths: 10

  strict: true

  # If true, optional edge attributes such as length, speed, lanes, b, power
  # may receive safe defaults if missing.
  allow_safe_defaults: true

  coalesce_sparse_tensors: true

  # Keep both formats for compatibility:
  #   route_masks: [OD, K, Links]
  #   delta_matrix: [Links, OD*K]
  build_legacy_route_masks: true
  build_delta_matrix: true

  required_edge_attributes:
    - free_flow_time
    - capacity

  optional_edge_defaults:
    free_flow_time: 1.0
    capacity: 1000.0
    length: 1.0
    lanes: 1
    speed: 15.0
    link_type: 0
    b: 0.15
    power: 4.0
    toll: 0.0


# -----------------------------------------------------------------------------
# Model-space configuration
# -----------------------------------------------------------------------------
#
# Parameters that define tensor shapes and model input conventions.
# -----------------------------------------------------------------------------

model:
  k_paths: 10

  # If true, training code should use OD vectors aligned with the sparse
  # route-based OD space rather than dense node x node space.
  od_target_sparse: true

  # Kept for compatibility with downstream training code.
  route_tensor_format: delta_matrix

  supported_route_tensor_formats:
    - delta_matrix
    - route_masks


# -----------------------------------------------------------------------------
# Validation configuration
# -----------------------------------------------------------------------------
#
# Controls whether and how the final artifact is validated.
# -----------------------------------------------------------------------------

validation:
  enabled: true
  strict: true

  check_route_graph_compatibility: true
  check_tensor_values: true
  check_indexing_consistency: true
  check_target_masks: true
  check_physical_tensors: true

  max_reported_items: 20

  # If true, artifact generation fails when validation errors exist.
  raise_on_error: true

  # If true, warnings are saved in metadata but do not stop execution.
  save_warnings_to_metadata: true


# -----------------------------------------------------------------------------
# Artifact saving configuration
# -----------------------------------------------------------------------------

artifact:
  artifact_type: base_artifact
  artifact_version: "1.0"

  save_joblib: true
  save_manifest: true

  # Store raw DataFrames and processed objects in the base artifact.
  include_raw_layer: true
  include_processed_layer: true
  include_model_ready_layer: false

  # Useful for debugging; can be disabled later if artifact size becomes large.
  include_reader_metadata: true
  include_builder_metadata: true
  include_environment_metadata: true
  include_config_snapshot: true

  compression:
    enabled: false
    method: null
    level: null


# -----------------------------------------------------------------------------
# Loader configuration
# -----------------------------------------------------------------------------
#
# Used by the base-artifact stage when reloading the artifact from disk.
# -----------------------------------------------------------------------------

loader:
  validate_on_load: true

  # Use null to avoid moving tensors automatically.
  # Use "cpu", "cuda" or "cuda:0" if needed.
  device: null

  artifact_filename: base_artifact.joblib


# -----------------------------------------------------------------------------
# Logging and diagnostics
# -----------------------------------------------------------------------------

logging:
  level: INFO

  print_summary: true

  log_reader_summaries: true
  log_builder_summaries: true
  log_validation_summary: true

  save_diagnostics: true
  diagnostics_filename: data_processing_diagnostics.json


# -----------------------------------------------------------------------------
# Debugging and development switches
# -----------------------------------------------------------------------------

debug:
  enabled: false

  # If true, readers/builders may print additional internal diagnostics.
  verbose: false

  # If true, the artifact is built but not saved.
  dry_run: false

  # If true, only a small subset of rows/routes may be processed.
  # Keep false for production.
  sample_mode: false

  sample_limits:
    max_links: null
    max_od_pairs: null
    max_routes_per_od: null
