# configs/model/CGAME_MLP_SUE.yaml
# =============================================================================

# 1. Target
_target_: src.components.models.CGAME_MLP_SUE.CyclicODModel
model_name: "CGAME_MLP_SUE"

# 2. Arquitectura (Hiperparámetros del modelo)
hidden_dim: 128
feature_dim: 64
num_structures: 5
dropout: 0.0

# 3. Pesos de la Función de Pérdida (Loss Weights)
loss_weights:
  w_flow: 1.0
  w_od: 100.0
  w_reg: 0.01
  w_physics: 0.5

# 4. Configuración de la Función de Costo (VDF)
vdf_config: ${vdf}

# 5. Datos Dinámicos
# (???) Significa que son obligatorios
num_links: ???
num_od_pairs: ???
t0: ???
capacity: ???
route_masks: ???
od_pair_indices: ???
num_link_groups: ???
link_group: ???