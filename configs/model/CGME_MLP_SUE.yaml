# configs/model/CGME_MLP_SUE.yaml

# 1. Target: Apunta al wrapper de compatibilidad o al modelo directo
_target_: src.components.models.CGME_MLP_SUE.CyclicODModel
model_name: "CGME_MLP_SUE"

# 2. Arquitectura
hidden_dim: 128
feature_dim: 64
num_structures: 5
dropout: 0.1

# 3. Configuración de la Función de Pérdida (NUEVO BLOQUE)
loss:
  _target_: src.components.models.CGME_MLP_SUE.LossCalculator
  w_counts: 1.0
  w_od: 0.0
  w_reg: 0.01
  adaptive_weights: false

# 4. Pesos para legacy (se ignoran si usamos el bloque loss, pero evitan errores si algo los busca)
loss_weights:
  w_flow: 1.0
  w_od: 1.0
  w_reg: 0.01

# 5. Configuración VDF
vdf_config: ${vdf}

# 6. Datos Dinámicos
num_links: ???
num_od_pairs: ???
t0: ???
capacity: ???
route_masks: ???
od_pair_indices: ???
num_link_groups: ???
link_group: ???