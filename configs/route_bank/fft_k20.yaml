id: fft_k20
asset_type: route_set

builder:
  engine: rustworkx_optimized
  weight: free_flow_time
  k_generate: 20

constraints:
  allow_duplicates: false
  allow_loops: true
  allow_auto_routes: true

connectors:
  connector_link_types: [99]

ordering:
  route_rank_policy: engine_order
  cost_field: free_flow_time

compatibility:
  requires_network_fingerprint: true
  requires_od_space_fingerprint: true

storage:
  format: joblib
  directory: asset_cache/route_banks
