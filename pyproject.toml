[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dl_pipeline_aadt"
version = "0.1.0"
description = "Deep Learning Pipeline for AADT estimation"
dependencies = [
    "hydra-core>=1.3.4",
    "igraph>=1.0.0",
    "igraph>=1.0.0",
    "joblib>=1.5.3",
    # Add your requirements here, e.g., "torch", "pandas"
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pathlib>=1.0.1",
    "rustworkx>=0.18.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
    "httpx2>=2.9.1",
    "pyproj>=3.7.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pipreqs>=0.5.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
