
General:
  Name: Synthetic02
  Description: A synthetic small scenario.
  Seed: 10


Magnitude:
  Coordinates:
    x_min: 0
    x_max: 100
    y_min: 0
    y_max: 100

  Demand: 2
    

DemandData:
  NUM_DAYS: 10
  START_DATE: "2022-01-01" # YYYY-MM-DD optional, solo para referencia
  TIME_INTERVAL: H # H: hourly, 15m: 15 minutes, etc.

  Magnitude:
    min_trips_od: 0
    max_trips_od: 500

  Profiles:
    Peak_times: [8, 17] # Horas del día para los picos
    Valley_times: [0, 23] # Horas del día para los valles

    Num_peaks: 2 # Debe calcularse automáticamente a partir de Peak_times
    Num_valleys: 2 # Debe calcularse automáticamente a partir de Valley_times

    Multiplier_Peak: 2.0 # Hacer un poco random TODO
    Multiplier_Valley: 0.5 # Hacer un poco random TODO
    Multiplier_Normal: 1.0 # Hacer un poco random TODO


NetworkStructure:
  NUM_ZONES: 3
  NUM_TAZ: 3
  NUM_AUX: 0
  NUM_INTERSECTIONS: 5

NetworkParameters:
  K_paths: 5

Catalogues:
  Network:
  # Definición de tipos de enlaces (link types) y sus atributos asociados
    1: 
      description: "Highways"
      capacity: 1800
      lanes: 3
      toll: 0  # Assuming toll is a binary attribute (0 for no toll, 1 for toll)
      allowed_vdfs: [1]  # List of VDF IDs compatible with this type
    2:
      description: "Arterials"
      capacity: 900
      lanes: 2
      toll: 0
      allowed_vdfs: [1, 2] # Can have multiple VDF profiles
    99:
      description: "Connectors (Auxiliary)"
      capacity: 9999
      lanes: 1
      toll: 0
      allowed_vdfs: [99]
 

  VDF:
    1:
      description: "BPR standard"
      b: 0.15
      power: 4.0
      speed_limit: 60.0
    2:
      description: "BPR modified for arterials"
      b: 0.20
      power: 5.0
      speed_limit: 45.0
    99:
      description: "Free flow (for connectors)"
      b: 0.0
      power: 0.0
      speed_limit: 9999.0
 
  
Visualization:
  Nodes:

    Label_Size: 12
    Label_Color: "black"

    TAZ:
      Size: 300
      Color: "e74c3c" # Red
      Label: true
      Marker: "s" # Square marker for TAZ
      Label: "TAZ"

    AUX:
      Size: 200
      Color: "2ecc71" # Green
      Label: true
      Marker: "^" # Triangle marker for AUX
      Label: "AUX"

    INTERSECTIONS:
      Size: 100
      Color: "3498db" # Blue
      Label: true
      Marker: "o" # Circle marker for Intersections
      Label: "Intersection"

  Edges:
    Width: 2
    Color: "gray"
    Label: true
    Label_Size: 10
    Label_Color: "black"

  VDF_Curves: # TODO: Esto es un placeholder, la visualización de curvas VDF puede ser más compleja y requerir su propia sección
    Show: true
    Color: "orange"
    Width: 2
    Label: true
    Label_Size: 10
    Label_Color: "black"
